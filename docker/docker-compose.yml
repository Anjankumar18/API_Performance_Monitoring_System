version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: api_monitor_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: apimonitor
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: api_monitor_redis
    ports:
      - "6379:6379"
